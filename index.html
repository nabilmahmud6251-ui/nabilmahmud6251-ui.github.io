<div id="app">

<script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=id=>document.getElementById(id);
const COLS=7;let W,H,S,DPR;
const ST={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let best=ST.get('cc_best',0),bank=ST.get('cc_bank',0),owned=ST.get('cc_own',[0]),skin=ST.get('cc_skin',0),mute=ST.get('cc_mute',false);
   // PLAYER LEVEL PROGRESSION
let playerLevel = ST.get('ncc_player_level', 1);
let levelPoints = ST.get('ncc_level_points', 0);
let matchRewarded = false; 
  function pointsNeeded(level){
  return 100 + (level - 1) * 25;
}

function savePlayerLevel(){
  ST.set('ncc_player_level', playerLevel);
  ST.set('ncc_level_points', levelPoints);
}

function awardLevelPoints(points){
  if(matchRewarded) return;
  matchRewarded = true;
  levelPoints += points;

  while(levelPoints >= pointsNeeded(playerLevel)){
    levelPoints -= pointsNeeded(playerLevel);
    playerLevel++;
  }

  savePlayerLevel();
  const levelDisplay = document.getElementById('nccPlayerLevel');
if(levelDisplay) levelDisplay.textContent = playerLevel;
     const pointsDisplay = document.getElementById('nccLevelPoints');
if(pointsDisplay) pointsDisplay.textContent = levelPoints;
}   
const SK=[{n:'Classic',b:'#ffffff',c:'#e63946',cost:0},{n:'Golden',b:'#ffd23f',c:'#ff7b00',cost:25,crown:1},{n:'Ninja',b:'#3a3d5c',c:'#8d99ae',cost:60,band:1},{n:'Pinky',b:'#ff8fc7',c:'#c9184a',cost:120},{n:'Rainbow',b:'rb',c:'#e63946',cost:250}];
const CARS=['#e63946','#2a9df4','#ffb703','#8338ec','#06d6a0','#fb5607'];
function resize(){DPR=Math.min(devicePixelRatio||1,2);H=innerHeight;W=Math.min(innerWidth,H*.62);S=W/COLS;$('app').style.width=W+'px';C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

/* ---------- sound ---------- */
let AC;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty='square',v=.07,sl=0,dl=0){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
const sfx={hop(){tone(380,.09,'square',.06,300)},coin(){tone(988,.08,'square',.07);tone(1319,.16,'square',.07,0,.08)},bump(){tone(120,.1,'triangle',.1)},
 die(){tone(320,.5,'sawtooth',.1,-260);tone(90,.3,'square',.1,0,.05)},splash(){tone(500,.4,'sine',.12,-420)},bell(){tone(1300,.07,'triangle',.06)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.07,0,i*.11))},cluck(){tone(600,.06,'sawtooth',.05,300);tone(700,.06,'sawtooth',.05,300,.09)},horn(){tone(220,.18,'sawtooth',.05)}};
$('mute').textContent=mute?'🔇':'🔊';
$('mute').onclick=()=>{mute=!mute;ST.set('cc_mute',mute);$('mute').textContent=mute?'🔇':'🔊'};

/* ---------- drawing helpers ---------- */
function chicken(g,x,y,u,k,sq=1,t=0){
 const s=SK[k];let b=s.b;if(b==='rb')b=`hsl(${(t*200)%360},90%,65%)`;
 g.save();g.translate(x,y);g.scale(1+(1-sq)*.4,sq);g.lineJoin='round';
 g.strokeStyle='#ff9f1c';g.lineWidth=5*u;g.beginPath();g.moveTo(-12*u,-10*u);g.lineTo(-12*u,0);g.moveTo(12*u,-10*u);g.lineTo(12*u,0);g.stroke();
 g.strokeStyle='#222';g.lineWidth=3*u;g.fillStyle=s.c;
 [-12,0,12].forEach((dx,i)=>{g.beginPath();g.arc(dx*u,(-66-(i==1?5:0))*u,9*u,0,7);g.fill();g.stroke()});
 g.fillStyle=b;g.beginPath();g.ellipse(0,-36*u,32*u,30*u,0,0,7);g.fill();g.stroke();
 g.beginPath();g.ellipse(-31*u,-30*u,9*u,15*u,.3,0,7);g.fill();g.stroke();g.beginPath();g.ellipse(31*u,-30*u,9*u,15*u,-.3,0,7);g.fill();g.stroke();
 if(s.band){g.fillStyle='#d62828';g.fillRect(-31*u,-54*u,62*u,15*u)}
 [-12,12].forEach(dx=>{g.fillStyle='#fff';g.beginPath();g.arc(dx*u,-46*u,7*u,0,7);g.fill();g.fillStyle='#222';g.beginPath();g.arc(dx*u,-45*u,4*u,0,7);g.fill()});
 g.fillStyle='#ff9f1c';g.beginPath();g.moveTo(-8*u,-36*u);g.lineTo(8*u,-36*u);g.lineTo(0,-24*u);g.closePath();g.fill();g.stroke();
 g.fillStyle=s.c;g.beginPath();g.arc(0,-21*u,4.5*u,0,7);g.fill();
 if(s.crown){g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-14*u,-73*u);g.lineTo(-14*u,-88*u);g.lineTo(-7*u,-80*u);g.lineTo(0,-92*u);g.lineTo(7*u,-80*u);g.lineTo(14*u,-88*u);g.lineTo(14*u,-73*u);g.closePath();g.fill();g.stroke()}
 g.restore()}
function rr(x,y,w,h,r,c,st){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill();if(st){X.strokeStyle='#222';X.lineWidth=2;X.stroke()}}
function wheel(x,y){X.fillStyle='#222';X.beginPath();X.arc(x,y,S*.1,0,7);X.fill()}
function drawVeh(b,d,y){
 const x=b.x*S,w=b.w*S,h=S*.6,yy=y+S*.18;
 if(b.k==='c'){rr(x,yy,w,h,9,b.c,1);rr(d>0?x+w*.5:x+w*.1,yy+h*.15,w*.4,h*.45,5,'#bdeaff');rr(d>0?x+w-5:x,yy+h*.2,5,h*.2,2,'#fff3a0');wheel(x+w*.25,yy+h);wheel(x+w*.75,yy+h)}
 else{rr(d>0?x:x+w*.3,yy,w*.7,h,6,b.c,1);rr(d>0?x+w*.72:x,yy+h*.1,w*.28,h*.9,8,'#f1faee',1);rr(d>0?x+w*.82:x+w*.04,yy+h*.2,w*.12,h*.3,3,'#bdeaff');wheel(x+w*.18,yy+h);wheel(x+w*.5,yy+h);wheel(x+w*.85,yy+h)}}
function drawLog(b,y){const x=b.x*S,w=b.w*S;rr(x,y+S*.12,w,S*.76,14,'#8b5a2b',1);X.strokeStyle='#c08a4d';X.lineWidth=2;for(let i=.3;i<w/S;i+=.7){X.beginPath();X.moveTo(x+i*S,y+S*.25);X.lineTo(x+i*S+8,y+S*.75);X.stroke()}}
function drawTrain(T,d,y){const x=T.x*S,w=12*S;rr(x,y+S*.08,w,S*.84,10,'#d62828',1);X.fillStyle='#ffd23f';X.fillRect(x+4,y+S*.45,w-8,S*.1);for(let i=1;i<12;i++)rr(x+i*S-S*.25,y+S*.18,S*.5,S*.22,4,'#bdeaff');rr(d>0?x+w-S*1.2:x,y+S*.08,S*1.2,S*.84,10,'#9d0208',1)}
function tree(x,y){X.fillStyle='#7b4a1e';X.fillRect(x+S*.4,y+S*.45,S*.2,S*.45);X.fillStyle='#2d9b3a';X.strokeStyle='#1b5e20';X.lineWidth=2;X.beginPath();X.arc(x+S*.5,y+S*.35,S*.36,0,7);X.fill();X.stroke();X.fillStyle='#3fc14f';X.beginPath();X.arc(x+S*.4,y+S*.28,S*.14,0,7);X.fill()}

/* ---------- game state ---------- */
const GR={t:'g',trees:[],o:[],coin:null};
let rows=[],LEN=10,L=1,score=0,lsScore=0,maxR=0,state='menu',ck,cam=0,idle=0,deadT=0,dk='',banner=0,bellT=0,parts=[],time=0,shake=0;
const ty_=r=>H*.72-(r-cam+1)*S;
const rnd=(a,b)=>a+Math.random()*(b-a);
function gen(l){
 LEN=10+l*4;rows=[];let run=0,last='g';const m=1+.1*l;
 for(let r=0;r<=LEN;r++){
  const o={t:'g',d:Math.random()<.5?-1:1,o:[],trees:[],coin:null,ph:0,tm:rnd(1,4)};
  if(r>=2&&r<LEN){
   const w={g:last==='g'?(run>=2?0:.7):1.5,road:last==='road'&&run>=3?0:5,river:l>=2&&!(last==='river'&&run>=2)?2+l*.15:0,rail:l>=4&&last!=='rail'?1.2:0};
   let tot=0,k;for(k in w)tot+=w[k];let q=Math.random()*tot;for(k in w){q-=w[k];if(q<=0){o.t=k;break}}
  }
  if(o.t===last)run++;else{run=1;last=o.t}
  if(o.t==='road'){o.sp=rnd(1.3,2.8)*m;let x=-4;const tp=.12+l*.03;while(x<COLS+4){const tr=Math.random()<tp,w=tr?2.4:1.3;o.o.push({x,w,k:tr?'t':'c',c:CARS[Math.random()*6|0]});x+=w+Math.max(2.6,5.5-l*.25)+rnd(0,3)}o.pp=x+4}
  else if(o.t==='river'){o.sp=rnd(.8,1.9)*(1+.07*l);let x=-4;while(x<COLS+4){const w=Math.max(1.6,3.2-l*.12+Math.random());o.o.push({x,w,k:'l'});x+=w+1+l*.18+rnd(0,1.1)}o.pp=x+4}
  else if(o.t==='rail'){o.sp=16;o.tr={x:-99}}
  else if(r>0&&r<LEN){const n=Math.random()*2.2|0;while(o.trees.length<n){const c=Math.random()*COLS|0;if(!o.trees.includes(c))o.trees.push(c)}}
  if(o.t!=='river'&&r>0&&r<LEN&&Math.random()<.38){const c=Math.random()*COLS|0;if(!o.trees.includes(c))o.coin=c}
  rows.push(o)}
}
function start(l){
 matchRewarded=false;
 L=l;gen(l);lsScore=score;ck={r:0,x:3,hop:null};cam=0;maxR=0;idle=0;parts=[];state='play';banner=1.8;ov(null);hud();sfx.cluck()
}
function hud(){$('lv').textContent='Lv '+L+'/10';$('sc').textContent=score;$('co').textContent='🪙 '+bank;$('fill').style.width=(maxR/LEN*100)+'%'}
function spark(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-120,120),vy:rnd(-200,-20),l:.8,c:col,s:rnd(3,7)})}
function cpos(){const h=ck.hop;let x=ck.x,r=ck.r,j=0;if(h){x=h.fx+(h.tx-h.fx)*h.t;r=h.fr+(h.tr-h.fr)*h.t;j=Math.sin(Math.PI*h.t)*S*.4}return{x,r,j,sx:(x+.5)*S,sy:ty_(r)+S*.92-j}}

function move(dr,dc){
 if(state!=='play'||ck.hop)return;
 const nr=ck.r+dr;if(nr<0||nr>LEN)return;
 const row=rows[nr];let nx=ck.x+dc;
 if(row.t==='g'||(dc&&rows[ck.r].t==='g'))nx=Math.round(nx);
 if(nx<(row.t==='g'?0:-.5)||nx>COLS-(row.t==='g'?1:.5))return;
 if(row.t==='g'&&row.trees.includes(nx)){sfx.bump();shake=.15;return}
 ck.hop={t:0,fr:ck.r,fx:ck.x,tr:nr,tx:nx};sfx.hop()}
function land(){
 const row=rows[ck.r];
 if(ck.r>maxR){maxR=ck.r;score+=10;idle=0}
 if(row.coin!==null&&Math.abs(ck.x-row.coin)<.6){row.coin=null;bank++;score+=50;ST.set('cc_bank',bank);sfx.coin();const p=cpos();spark(p.sx,p.sy-S*.5,'#ffd23f',12)}
 hud();
 if(ck.r===LEN){state='win';score+=100*L;sfx.win();hud();setTimeout(showWin,700)}}
function die(k){
 state='dead';dk=k;deadT=0;
awardLevelPoints(10 + maxR * 2);
const p=cpos();
awardLevelPoints(10 + maxR * 2);
const p=cpos();
 if(k==='water'||k==='off')sfx.splash();else sfx.die();
 spark(p.sx,p.sy-S*.4,k==='water'?'#9be7ff':'#fff',22);shake=.3;
 if(score>best){best=score;ST.set('cc_best',best)}
 setTimeout(showOver,1000)}
function hazards(dt){
 const h=ck.hop,r=h?(h.t>.5?h.tr:h.fr):ck.r,row=rows[r],cx=h?h.fx+(h.tx-h.fx)*h.t:ck.x;
 if(row.t==='road'){for(const b of row.o)if(cx+.78>b.x+.08&&cx+.22<b.x+b.w-.08){die(b.k==='t'?'truck':'car');return}}
 else if(row.t==='rail'&&row.ph===2){if(cx+.78>row.tr.x&&cx+.22<row.tr.x+12)die('train')}
 else if(row.t==='river'&&!h){
  let on=false;for(const b of row.o)if(cx+.5>b.x&&cx+.5<b.x+b.w){on=true;break}
  if(!on){die('water');return}
  ck.x+=row.d*row.sp*dt;if(ck.x<-.5||ck.x>COLS-.5)die('off')}}

function update(dt){
 time+=dt;if(banner>0)banner-=dt;if(shake>0)shake-=dt;
 let bell=false;
 for(let i=0;i<rows.length;i++){const o=rows[i];
  if(o.t==='road'||o.t==='river'){const d=o.d*o.sp*dt;for(const b of o.o){b.x+=d;if(b.x>=o.pp-4)b.x-=o.pp;if(b.x<-4)b.x+=o.pp}}
  else if(o.t==='rail'){
   if(o.ph===0){o.tm-=dt;if(o.tm<=0){o.ph=1;o.tm=1.4}}
   else if(o.ph===1){if(Math.abs(i-ck.r)<7)bell=true;o.tm-=dt;if(o.tm<=0){o.ph=2;o.tr.x=o.d>0?-13:COLS+1;if(Math.abs(i-ck.r)<8)sfx.horn()}}
   else{o.tr.x+=o.d*o.sp*dt;if((o.d>0&&o.tr.x>COLS+1)||(o.d<0&&o.tr.x<-13)){o.ph=0;o.tm=rnd(2,5)}}}}
 if(bell&&state==='play'){bellT-=dt;if(bellT<=0){sfx.bell();bellT=.25}}
 if(state==='play'){
  if(ck.hop){ck.hop.t+=dt/.11;if(ck.hop.t>=1){const h=ck.hop;ck.r=h.tr;ck.x=h.tx;ck.hop=null;land()}}
  hazards(dt);
  idle+=dt;if(idle>8)die('eagle')}
 if(state==='dead')deadT+=dt;
 const p=cpos();cam+=(p.r-cam)*Math.min(1,dt*6);
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.l-=dt}parts=parts.filter(q=>q.l>0)}

/* ---------- render ---------- */
function render(){
 X.clearRect(0,0,W,H);X.save();
 if(shake>0)X.translate(rnd(-3,3),rnd(-3,3));
 const r0=Math.floor(cam-(H*.28)/S)-1,r1=Math.ceil(cam+H*.72/S)+1;
 for(let r=r1;r>=r0;r--){
  const row=rows[r]||GR,y=ty_(r);
  if(row.t==='g'){X.fillStyle=r%2?'#82dc5a':'#74cf4d';X.fillRect(0,y,W,S+1);
   if(r===LEN){for(let i=0;i<COLS*2;i++)for(let j=0;j<2;j++){X.fillStyle=(i+j)%2?'#fff':'#222';X.fillRect(i*S/2,y+j*S/2,S/2,S/2)}}
   for(const c of row.trees)tree(c*S,y)}
  else if(row.t==='road'){X.fillStyle='#4a4e69';X.fillRect(0,y,W,S+1);X.fillStyle='#ffffff99';for(let i=0;i<COLS*2;i++)X.fillRect(i*S/2+S*.08,y+S*.47,S*.3,4)}
  else if(row.t==='river'){X.fillStyle='#3ab5f0';X.fillRect(0,y,W,S+1);X.strokeStyle='#ffffff77';X.lineWidth=2;for(let i=0;i<COLS;i++){X.beginPath();X.arc(i*S+((time*20+r*13)%S),y+S*(.3+.4*((i+r)%2)),S*.12,3.4,6)  ;X.stroke()}}
  else{X.fillStyle='#b9b2a6';X.fillRect(0,y,W,S+1);X.fillStyle='#7b5e48';for(let i=0;i<COLS*3;i++)X.fillRect(i*S/3+4,y+S*.1,S*.12,S*.8);X.fillStyle='#6b6b78';X.fillRect(0,y+S*.28,W,5);X.fillRect(0,y+S*.66,W,5);
   if(row.ph===1){const on=Math.sin(time*18)>0;X.fillStyle=on?'#ff2b2b':'#661111';X.beginPath();X.arc(S*.4,y+S*.5,S*.2,0,7);X.arc(W-S*.4,y+S*.5,S*.2,0,7);X.fill()}}
  if(row.coin!==null){const cx=(row.coin+.5)*S,cy=y+S*.5,sc=Math.abs(Math.cos(time*4));X.fillStyle='#ffd23f';X.strokeStyle='#b8860b';X.lineWidth=3;X.beginPath();X.ellipse(cx,cy+Math.sin(time*5)*3,S*.24*Math.max(.15,sc),S*.28,0,0,7);X.fill();X.stroke()}
  if(row.t==='road')for(const b of row.o)drawVeh(b,row.d,y);
  else if(row.t==='river')for(const b of row.o)drawLog(b,y);
  else if(row.t==='rail'&&row.ph===2)drawTrain(row.tr,row.d,y)}
 /* chicken */
 if(ck){const p=cpos();let sq=1,yy=p.sy,al=1;
  if(state==='dead'){if(dk==='car'||dk==='truck'||dk==='train')sq=.18;else if(dk==='eagle')yy-=deadT*S*9;else{yy+=Math.min(deadT,.5)*S*.7;al=Math.max(0,1-deadT*1.6)}}
  else if(p.j>0)sq=1+Math.sin(Math.PI*ck.hop.t)*.12;
  X.fillStyle='#0003';X.beginPath();X.ellipse(p.sx,p.sy+p.j,S*.28,S*.09,0,0,7);X.fill();
  X.globalAlpha=al;chicken(X,p.sx,yy,S*.0105,skin,sq,time);X.globalAlpha=1;
  if(dk==='eagle'&&state==='dead'){X.font=S+'px serif';X.textAlign='center';X.fillText('🦅',p.sx,yy-S*1.1)}}
 for(const q of parts){X.globalAlpha=Math.max(0,q.l);X.fillStyle=q.c;X.beginPath();X.arc(q.x,q.y,q.s,0,7);X.fill()}X.globalAlpha=1;
 X.restore();
 X.textAlign='center';X.lineJoin='round';
 if(state==='play'&&banner>0){X.font='900 '+S*.8+'px system-ui';X.strokeStyle='#222';X.lineWidth=7;X.fillStyle='#ffd23f';X.globalAlpha=Math.min(1,banner);X.strokeText('LEVEL '+L,W/2,H*.3);X.fillText('LEVEL '+L,W/2,H*.3);X.globalAlpha=1}
 if(state==='play'&&idle>4){X.font='900 '+S*.5+'px system-ui';X.strokeStyle='#222';X.lineWidth=5;X.fillStyle=Math.sin(time*14)>0?'#ff4d4d':'#fff';X.strokeText('🦅 HURRY! MOVE!',W/2,H*.4);X.fillText('🦅 HURRY! MOVE!',W/2,H*.4)}}

let lt=0;
function loop(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;update(dt);render();requestAnimationFrame(loop)}

/* ---------- screens ---------- */
const ovEl=$('ov');
function ov(h){if(h==null){ovEl.style.display='none';return}ovEl.style.display='flex';ovEl.innerHTML=h}
const CR='<div class="credit">Created by Nabil Mahmud</div>';
function menu(){state='menu';
 ov(`<div style="font-size:52px">🐔</div><h1>Crazy Chicken</h1><h2>Road Survival</h2><div>🏆 Best ${best} &nbsp;·&nbsp; 🪙 ${bank}</div>
 <div class="hint">Tap a skin to pick it. Collect coins to unlock more!</div>
 <div class="skins">${SK.map((s,i)=>`<div class="sk ${i===skin?'on':''}" data-i="${i}"><canvas width="96" height="96"></canvas>${owned.includes(i)?s.n:'🪙 '+s.cost}</div>`).join('')}</div>
 <button class="btn" data-a="play">PLAY</button>
 <div class="hint">Tap = hop forward · Swipe = left / right / back<br>Ride logs, dodge cars and trains. 10 levels!</div>${CR}`);
 ovEl.querySelectorAll('.sk canvas').forEach((c,i)=>chicken(c.getContext('2d'),48,88,.9,i,1,1.2))}
function showOver(){
 const why={car:'Splat! A car got you.',truck:'Flattened by a truck!',train:'The train was faster!',water:'Splash! Chickens cannot swim.',off:'Swept away by the river!',eagle:'An eagle snatched you!'}[dk]||'Game over';
 ov(`<h1>GAME OVER</h1><h2>${why}</h2><div style="font-size:24px;font-weight:800">Score ${score}</div><div>🏆 Best ${best} · Level ${L}/10 · 🪙 ${bank}</div>
 <button class="btn" data-a="retry">↻ RESTART</button><button class="btn alt" data-a="menu">Skins / Menu</button>${CR}`)}
function showWin(){
 awardLevelPoints(40);
 eif(score>best){best=score;ST.set('cc_best',best)}
 if(L>=10)ov(`<div style="font-size:60px">🏆</div><h1>YOU WIN!</h1><h2>You are the Crazy Chicken champion!</h2><div style="font-size:24px;font-weight:800">Score ${score}</div><div>🏆 Best ${best}</div><button class="btn" data-a="new">PLAY AGAIN</button><button class="btn alt" data-a="menu">Menu</button>${CR}`);
 else ov(`<div style="font-size:52px">🎉</div><h1>LEVEL ${L} CLEAR!</h1><div style="font-size:24px;font-weight:800">Score ${score}</div><div>Bonus +${100*L} · 🪙 ${bank}</div><button class="btn" data-a="next">NEXT LEVEL ▶</button>${CR}`)}
ovEl.addEventListener('click',e=>{
 initAudio();const sk=e.target.closest('.sk'),b=e.target.closest('[data-a]');
 if(sk){const i=+sk.dataset.i;if(owned.includes(i)){skin=i}else if(bank>=SK[i].cost){bank-=SK[i].cost;owned.push(i);skin=i;ST.set('cc_bank',bank);ST.set('cc_own',owned);sfx.win()}else sfx.bump();ST.set('cc_skin',skin);hud();menu();return}
 if(!b)return;const a=b.dataset.a;
 if(a==='play'||a==='new'){score=0;start(1)}
 else if(a==='retry'){score=lsScore;if(lsScore===0&&L===1)score=0;start(L)}
 else if(a==='next')start(L+1);
 else if(a==='menu')menu()});

/* ---------- input ---------- */
let tx=null,ty=0;
document.addEventListener('pointerdown',initAudio);
C.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY;e.preventDefault()});
C.addEventListener('pointerup',e=>{if(tx==null)return;const dx=e.clientX-tx,dy=e.clientY-ty;tx=null;
 if(Math.hypot(dx,dy)<24)move(1,0);else if(Math.abs(dx)>Math.abs(dy))move(0,dx>0?1:-1);else move(dy<0?1:-1,0)});
C.addEventListener('pointercancel',()=>tx=null);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{initAudio();const k=e.key.toLowerCase();
 if(k==='arrowup'||k==='w'||k===' ')move(1,0);else if(k==='arrowdown'||k==='s')move(-1,0);else if(k==='arrowleft'||k==='a')move(0,-1);else if(k==='arrowright'||k==='d')move(0,1);
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault()});

gen(1);ck={r:0,x:3,hop:null};hud();menu();requestAnimationFrame(loop);
